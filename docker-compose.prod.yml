x-backend: &backend
  image: rulekit-api:local
  build:
    context: .
    dockerfile: docker/Dockerfile.api
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL using postgres as the host}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:?set WEBHOOK_SIGNING_KEY}
    WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN to the web console origin}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rulekit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rulekit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    <<: *backend
    command: ["node", "../../node_modules/prisma/build/index.js", "migrate", "deploy"]
    working_dir: /app/apps/api
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on: &backend-ready
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    depends_on: *backend-ready

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
